name: CI/CD Pipeline
on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]
jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12.2'
      - name: Install uv via pip
        run: |
          python -m pip install --upgrade pip
          pip install uv
      - name: Install dependencies with uv sync
        run: |
          uv sync
      - name: Run unit tests with uv run pytest
        run: |
          uv run pytest flask_api.py
  deploy:
    name: Deploy to Heroku
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/dev'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12.2'
      - name: Install uv via pip
        run: |
          python -m pip install --upgrade pip
          pip install uv
      - name: Install dependencies with uv sync
        run: |
          uv sync
      - name: Install Heroku CLI
        run: |
          curl https://cli-assets.heroku.com/install.sh | sh
      - name: Authenticate and set Heroku remote
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          HEROKU_APP_NAME: ${{ secrets.HEROKU_APP_NAME }}
        run: |
          cat > ~/.netrc <<EOF
          machine api.heroku.com
            login $HEROKU_API_KEY
          machine git.heroku.com
            login $HEROKU_API_KEY
          EOF
          heroku git:remote -a "$HEROKU_APP_NAME"
      - name: Push dev branch to Heroku main
        run: |
          git push heroku dev:main